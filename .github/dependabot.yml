version: 2
updates:
  # The workflow pins each action to a commit SHA, so only these PRs move them forward.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A week lets a compromised release be caught and pulled before it reaches CI.
    cooldown:
      default-days: 7

  # The cooldown delays version updates only, never security updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Build and test tooling arrives as one PR. Each runtime dependency ships in the extension,
    # so it keeps its own PR and review.
    groups:
      dev-dependencies:
        dependency-type: development
