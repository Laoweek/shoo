<!-- captured 2026-10-18 from www.bilibili.com Home (an ad among the feed-cards), lang=zh-CN, signed out, anonymized.
     Structural skeleton. The ad looks like a video Tile, menu button included, but its links go to cm.bilibili.com
     (they also carry rel and data-target-url) and its stats row has an icon instead of a duration. Query strings and
     the landing URL dropped, svg paths dropped. -->
<div class="feed-card">
  <div class="bili-feed-card">
    <div class="bili-video-card is-rcmd">
      <div class="bili-video-card__wrap">
        <div class="bili-video-card__no-interest" style="display: none;">
          <div class="bili-video-card__no-interest--inner">
            <div class="bili-video-card__no-interest--left"><span class="no-interest-title">不感兴趣</span><span class="no-interest-desc">将减少此类内容推荐</span></div>
            <div class="bili-video-card__no-interest--right"><div class="revert-btn">撤销</div></div>
          </div>
        </div>
        <a class="bili-video-card__image--link" href="https://cm.bilibili.com/cm/api/fees/pc/sync/v2" target="_blank" rel="noopener" data-target-url="https://example.invalid/link">
          <div class="bili-video-card__image">
            <div class="bili-video-card__image--wrap">
              <picture class="v-img bili-video-card__cover"><img src="https://example.invalid/img.jpg" alt="Fixture ad title"></picture>
            </div>
            <div class="bili-video-card__mask">
              <div class="bili-video-card__stats">
                <div class="bili-video-card__stats--left">
                  <span class="bili-video-card__stats--item"><svg viewBox="0 0 24 24" width="24" height="24"></svg><span class="bili-video-card__stats--text">122.3万</span></span>
                  <span class="bili-video-card__stats--item"><svg viewBox="0 0 24 24" width="24" height="24"></svg><span class="bili-video-card__stats--text">263</span></span>
                </div>
                <svg viewBox="0 0 24 24" width="24" height="24"></svg>
              </div>
            </div>
          </div>
        </a>
        <div class="bili-video-card__info">
          <div class="bili-video-card__info--right">
            <div class="bili-video-card__info--no-interest"><svg class="bili-video-card__info--no-interest--icon" viewBox="0 0 16 16" width="16" height="16"></svg></div>
            <h3 class="bili-video-card__info--tit" title="Fixture ad title"><a href="https://cm.bilibili.com/cm/api/fees/pc/sync/v2" target="_blank" rel="noopener" data-target-url="https://example.invalid/link">Fixture ad title</a></h3>
            <div class="bili-video-card__info--bottom">
              <div class="bili-video-card__info--rcmd-text">Fixture rcmd</div>
              <a class="bili-video-card__info--owner" href="https://cm.bilibili.com/cm/api/fees/pc/sync/v2" target="_blank" rel="noopener" data-target-url="https://example.invalid/link">
                <span class="bili-video-card__info--author" title="Fixture Advertiser">Fixture Advertiser</span>
                <span class="bili-video-card__info--date">· 9月14日</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
