# English catalogue. Key format area.component.message (docs/spec/ui-design.md, Section 9).
# Placeholders: named ({cap}, {host}, {count}) as the spec asks, filled by t(key, { cap: 500 }).
# Plurals use the 1 / n forms with the count as $1: t(key, count) or t(key, count, { named }).
# A key is either a message or a group, never both, so "error" groups hold one message per reason.
extName: Shoo · Clear unwanted video recommendations
extDescription: Write what you don't want to see. Shoo tells YouTube and Bilibili "Not interested" for you, and shows which rule did it.
commandToggle: Turn Shoo on or off

common:
  wordmark: Shoo
  loading: Loading…
  dismiss: Dismiss
  retry: Retry
  cancel: Cancel
  save: Save
  add: Add
  delete: Delete
  undo: Undo
  keep: Keep
  new: New
  openSettings: Open settings
  keepChannel: Always keep this channel
  ruleRef: Rule {ref}

# Visually hidden status text beside the wordmark (ui-design.md Section 3, Accessibility).
eyes:
  status:
    watching: Shoo is on
    judging: Shoo is checking videos
    review: Shoo is waiting for you
    paused: Shoo is paused
    error: Shoo needs attention

mode:
  label: Mode
  auto: Auto
  review: Review
  dryRun: Dry-run
  hint:
    auto: Shoo removes straight away and tells you once per batch.
    review: Shoo asks on the video before telling the site anything.
    dryRun: Shoo only labels what it would remove. Nothing reaches the site.

verdict:
  remove: Remove
  keep: Keep
  pending: …
  percent: '{p}%'
  label:
    remove: 'Verdict: Remove, Rule: {rule}, {p} percent'
    removeExact: 'Verdict: Remove, Rule: {rule}'
    keep: 'Verdict: Keep'
    pending: Judging…

# label: the chip. text: the Rule the Decision model reads (calibrated, see docs/spec/decision-engine.md Section 2.3).
starter:
  reaction:
    label: Reaction videos
    text: Reaction videos, where someone watches and reacts to other content
