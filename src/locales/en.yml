  # A direct Decision provider whose choice question takes fewer options (decision-engine.md Section 12.1).
  tooManyRules: '{provider} takes at most {max} Topic rules, and {count} are on. Shoo checks no videos by topic until you switch some off, or pick another Decision provider in Connection.'
