      n: $1 all time
    lastHit: Last hit {time}
  try:
    label: Try a title
    title: Video title
    titlePlaceholder: Type or paste a video title
    channel: Channel
    site: Try it as a video on
    url: YouTube video URL or thumbnail URL (optional)
    urlInvalid: Use a YouTube video URL or an i.ytimg.com thumbnail URL.
    needsConsent: Give consent to try titles
    paused: Shoo is paused or can't reach OpenRouter right now. Check the popup.
    noCredits: OpenRouter says the key is out of credits.
    submit: Try
    idle: The Verdict shows up here.
    decidedBy: 'Decided by {rule}'
