rules:
  title: Rules
  lede: What you'd rather not see. Shoo checks every video against these and tells the site "Not interested" for you. A Rule works on all sites unless you limit it to one, and its colour follows it everywhere.
  yours: Your Rules
  sorted: Sorted by activity
  add: Add a Rule
  added: 'Rule added: {rule}'
  empty: Nothing to shoo yet. Add a Rule, or start from one of these.
  error:
    save: Couldn't save the Rule. Try again.
    syncQuota: Browser sync storage is full. Delete or shorten a Rule, then try again.
  disabled:
    needsModel: Topic and Thumbnail rules need consent and a Decision model.
    needsKey: Needs OpenRouter
  kind:
    label: Kind
    topic: Topic
    thumbnail: Thumbnail
    channel: Banned channel
    keyword: Title keyword
    pattern: Pattern
    regex: Regular expression
    duration: Duration
    views: Views
    short: Short
    live: Live
    channelAction: Don't recommend channel
    membersOnly: Members-only
    artistChannel: Artist channel
  # Where a Rule works (ADR 0012). Most work on all sites.
  site:
    label: Works on
    all: All sites
    only: '{site} only'
    youtubeKind: Bilibili videos never match this kind, so it works on YouTube only.
    channel: This channel is on {site}, so the Rule works there only.
  placeholder:
    channel: Channel name
    keep: Woodworking tutorials
    keyword: A word in titles
    thumbnail: A person pointing at a red arrow
  pattern:
    hint: '* matches any run of characters, ? matches one character.'
  artistChannel:
    hint: Keeps videos from channels with YouTube's music-note artist badge. Shorts shelf videos show no channel, so they never match.
  duration:
    min: At least (min)
    max: At most (min)
    between: Between {min} and {max} min
    shorter: Shorter than {max} min
    longer: Longer than {min} min
  views:
    min: At least (views)
    max: At most (views)
    hint: Type 10k or 1.5m for thousands or millions. Shoo reads view counts only while YouTube is in English, and live streams show none, so those videos never match.
    between: Between {min} and {max} views
    fewer: Fewer than {max} views
    more: More than {min} views
  text:
    counter: '{count} of {max}'
    over: Shorter Rules work better.
    live: Live streams
    artistChannel: Artist channels
  # A remove Rule that never removes videos from Subscribed channels (REQ-RULE-14). The list stays on this computer.
  skipSubscribed:
    label: Never shoo YouTube channels I'm subscribed to
    note: Skips subscribed channels
    hint: Shoo reads your subscriptions from YouTube about once a day and keeps them on this computer. Shorts shelf videos show no channel, so this never skips them.
    channels:
      1: 1 subscribed channel
      n: $1 subscribed channels
    read: 'Skips {channels}, read from YouTube {time}.'
    pending: Shoo reads your subscriptions from YouTube the next time it checks a video.
    unreadable: Shoo couldn't read your subscriptions from YouTube. Until it can, this Rule removes no YouTube video that shows a channel.
  # Rule name (REQ-RULE-11): the user's short label, shown instead of the Rule text. Never sent to a model.
  name:
    label: Name
    placeholder: Add a name
    hint: Shown on the video instead of the whole Rule. The model never sees it.
  # Soft hints while typing a Topic rule (REQ-RULE-12). English patterns only, they never block saving.
  hint:
    order: Describe the videos instead of giving an order, for example “Unboxing videos” rather than “No unboxing videos”.
    negation: Shoo reads “not” and “except” poorly. Write what to remove, and add a Keep rule for the exceptions.
  # How to write a Rule (REQ-RULE-12). Evidence: docs/spec/decision-engine.md Section 13.
  guide:
    title: How to write a Rule
    lede: For Topic rules, a model reads each video's title, channel name, length and where it shows up. It never sees the description, the comments or the video itself.
    good: Try
    avoid: Not
    describe:
      title: Describe the videos
      body: Write what the videos are, not an order.
      good: Unboxing videos and hauls
      avoid: No unboxing videos
    one:
      title: One idea per Rule
      body: Mixed topics get judged loosely. Separate Rules also tell you which one removed a video.
      good: Day trading
      avoid: Cars, sports or politics
    is:
      title: Say what a video is about
      body: Shoo keeps videos that only report on, explain or review a topic. Say so if those should go too.
      good: Celebrity gossip, including news about it
      avoid: Anything mentioning celebrities
    concrete:
      title: Name topics, not judgements
      body: Concrete topics match more reliably than words like “low quality” or “annoying”.
      good: Prank videos
      avoid: Low-effort videos
    noNot:
      title: Leave out “not” and “except”
      body: Put the exception in a Keep rule. Keep rules win over everything, so write them narrowly.
      good: Gaming videos, plus a Keep rule for speedruns
      avoid: Gaming videos except speedruns
    exact:
      title: Use an exact kind when you can
      body: A channel goes in Banned channel. A word goes in Title keyword, which also matches inside words, so “AI” matches “said”. Shorts, live streams and length have their own kinds. None of them needs the model.
    name:
      title: Give it a name
      body: The name is what you see on the video and in Activity. The model reads only the Rule.
    try: Check a Rule with Try a title below.
  regex:
    disabledNote: Off while Regular expression Rules are off in Advanced
    reason:
      tooLong: Use 200 characters or fewer.
      syntax: This isn't a valid regular expression.
      backreference: Backreferences aren't allowed.
      lookaround: Lookaheads and lookbehinds aren't allowed.
      nestedQuantifier: Repeats inside repeats aren't allowed, they can freeze matching.
      adjacentQuantifier: Two open-ended repeats next to each other aren't allowed.
      alternationInQuantifiedGroup: Alternatives inside a repeated group aren't allowed.
      flags: Flags aren't allowed. Shoo always ignores case.
  table:
    label: Rules
    more: More
    rule: Rule
    kind: Kind
    text: Name and description
    week: This week
    on: On
  row:
    text: '{ref} description'
    name: '{ref} name'
    delete: Delete {ref}
    on: '{ref} on'
    expand: Expand {ref}
