    judging: Shoo 正在检查视频
    review: Shoo 在等你确认
    paused: Shoo 已暂停
    error: Shoo 需要你处理

mode:
  label: 模式
  auto: 自动
  review: 确认
  dryRun: 试运行
  hint:
    auto: Shoo 直接移除，每批只告诉你一次。
    review: Shoo 先在视频上问你，再告诉网站。
    dryRun: Shoo 只标出会移除的视频，网站什么也收不到。

verdict:
  remove: 移除
  keep: 保留
  pending: …
  percent: '{p}%'
  label:
    remove: '判定：移除，规则：{rule}，百分之 {p}'
    removeExact: '判定：移除，规则：{rule}'
    keep: '判定：保留'
    pending: 判定中…

# label: the chip. text: the Rule the Decision model reads (calibrated, see docs/spec/decision-engine.md Section 2.3).
