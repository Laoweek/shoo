# Simplified Chinese catalogue. Mirrors en.yml key for key: same keys, same nesting, same order, no extras.
# Placeholders keep their English names ({cap}, {host}, {count}), filled by t(key, { cap: 500 }).
# Plurals keep both the 1 / n forms with the count as $1. The Chinese forms differ only in the number.
# A key is either a message or a group, never both, so "error" groups hold one message per reason.
extName: Shoo · 清除不想看的视频推荐
extDescription: 写下你不想看的内容。Shoo 替你在 YouTube 和 Bilibili 点“不感兴趣”，还会告诉你是哪条规则做的。
commandToggle: 开启或关闭 Shoo

common:
  wordmark: Shoo
  loading: 加载中…
  dismiss: 关闭
  retry: 重试
  cancel: 取消
  save: 保存
  add: 添加
  delete: 删除
  undo: 撤销
  keep: 保留
  new: 新
  openSettings: 打开设置
  keepChannel: 始终保留此频道
  ruleRef: 规则 {ref}

# Visually hidden status text beside the wordmark (ui-design.md Section 3, Accessibility).
eyes:
