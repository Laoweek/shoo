rules:
  title: 规则
  lede: 你不想看的内容。Shoo 用这些规则检查每个视频，并替你告诉网站“不感兴趣”。规则对所有网站生效，除非你把它限定在一个网站，它的颜色在各处都跟着它。
  yours: 你的规则
  sorted: 按活跃度排序
  add: 添加规则
  added: '已添加规则：{rule}'
  empty: 暂时没有要赶走的。添加一条规则，或从下面挑一条开始。
  error:
    save: 无法保存规则，请重试。
    syncQuota: 浏览器同步存储已满。删除或缩短一条规则后再试。
  disabled:
    needsModel: 主题规则和封面规则需要你同意发送，并有一个决策模型。
    needsKey: 需要 OpenRouter
  kind:
    label: 类型
    topic: 主题
    thumbnail: 封面
    channel: 屏蔽频道
    keyword: 标题关键词
    pattern: 通配符
    regex: 正则表达式
    duration: 时长
    views: 观看次数
    short: Shorts
    live: 直播
    channelAction: 不推荐此频道
    membersOnly: 会员专享
    artistChannel: 艺人频道
  # Where a Rule works (ADR 0012). Most work on all sites.
  site:
    label: 生效网站
    all: 所有网站
    only: '仅 {site}'
    youtubeKind: Bilibili 视频不会匹配这种类型，所以它只在 YouTube 上生效。
    channel: 这个频道在 {site} 上，所以这条规则只在那里生效。
  placeholder:
    channel: 频道名称
    keep: 木工教程
    keyword: 标题中的一个词
    thumbnail: 一个人指着红色箭头
  pattern:
    hint: '* 匹配任意一串字符，? 匹配一个字符。'
  artistChannel:
    hint: 保留带有 YouTube 音符艺人徽章的频道的视频。Shorts 栏的视频不显示频道，所以永远不会匹配。
  duration:
    min: 至少（分钟）
    max: 至多（分钟）
    between: '{min} 到 {max} 分钟'
    shorter: 短于 {max} 分钟
    longer: 长于 {min} 分钟
  views:
    min: 至少（次观看）
    max: 至多（次观看）
    hint: 输入 10k 或 1.5m 表示千或百万。Shoo 只在 YouTube 使用英文时才能读到观看次数，直播不显示观看次数，所以这些视频永远不会匹配。
    between: '{min} 到 {max} 次观看'
    fewer: 少于 {max} 次观看
    more: 多于 {min} 次观看
  text:
    counter: '{count} / {max}'
    over: 规则越短，效果越好。
    live: 直播
    artistChannel: 艺人频道
  # A remove Rule that never removes videos from Subscribed channels (REQ-RULE-14). The list stays on this computer.
  skipSubscribed:
    label: 永远不赶走我订阅的 YouTube 频道
    note: 跳过已订阅的频道
    hint: Shoo 大约每天从 YouTube 读取一次你的订阅，并保存在这台电脑上。Shorts 栏的视频不显示频道，所以这里永远不会跳过它们。
    channels:
      1: 1 个已订阅的频道
      n: $1 个已订阅的频道
    read: '跳过 {channels}，{time}从 YouTube 读取。'
    pending: Shoo 下次检查视频时会从 YouTube 读取你的订阅。
    unreadable: Shoo 无法从 YouTube 读取你的订阅。在读到之前，这条规则不会移除显示频道的 YouTube 视频。
  # Rule name (REQ-RULE-11): the user's short label, shown instead of the Rule text. Never sent to a model.
  name:
    label: 名称
    placeholder: 添加名称
    hint: 在视频上代替整条规则显示。模型看不到它。
  # Soft hints while typing a Topic rule (REQ-RULE-12). English patterns only, they never block saving.
  hint:
    order: 描述视频，而不是下命令，例如写“开箱视频”，而不是“不要开箱视频”。
    negation: Shoo 不太能理解“不”和“除了”。写要移除的内容，不想移除的部分另加一条保留规则。
  # How to write a Rule (REQ-RULE-12). Evidence: docs/spec/decision-engine.md Section 13.
  guide:
    title: 如何写规则
    lede: 对于主题规则，模型会读取每个视频的标题、频道名称、时长和出现位置。它看不到简介、评论，也看不到视频本身。
    good: 试试
    avoid: 别写
    describe:
      title: 描述视频
      body: 写视频是什么，而不是下命令。
      good: 开箱和购物分享视频
      avoid: 不要开箱视频
    one:
      title: 一条规则一个意思
      body: 混在一起的主题会判得很松。分开写还能让你知道是哪条规则移除了视频。
      good: 日内交易
      avoid: 汽车、体育或政治
    is:
      title: 说明视频是关于什么的
      body: 只是报道、讲解或评测某个主题的视频，Shoo 会保留。如果这些也要移除，请写明。
      good: 明星八卦，包括相关新闻
      avoid: 任何提到明星的内容
    concrete:
      title: 写主题，不写评价
      body: 具体的主题比“低质量”或“烦人”这类词匹配得更准。
      good: 恶作剧视频
      avoid: 粗制滥造的视频
    noNot:
      title: 不要写“不”和“除了”
      body: 不想移除的部分放进保留规则。保留规则优先于一切，所以范围要写小。
      good: 游戏视频，另加一条“速通”保留规则
      avoid: 游戏视频，速通除外
    exact:
      title: 能用精确类型就用
      body: 频道放进“屏蔽频道”。词语放进“标题关键词”，它也会匹配更长的词，所以“车”也会匹配“车厘子”。Shorts、直播和时长都有各自的类型。这些都不需要模型。
    name:
      title: 起个名字
      body: 名称会显示在视频上和活动记录里。模型只读规则本身。
    try: 可以用下方的“试一个标题”检查规则。
  regex:
    disabledNote: 已停用，因为“高级”中关闭了正则表达式规则
    reason:
      tooLong: 请不超过 200 个字符。
      syntax: 这不是有效的正则表达式。
      backreference: 不允许使用反向引用。
      lookaround: 不允许使用先行断言和后行断言。
      nestedQuantifier: 不允许重复中嵌套重复，那样可能卡死匹配。
      adjacentQuantifier: 不允许两个无上限的重复紧挨在一起。
      alternationInQuantifiedGroup: 不允许在重复的分组中使用多选分支。
      flags: 不允许使用标志。Shoo 始终忽略大小写。
  table:
    label: 规则
    more: 更多
    rule: 规则
    kind: 类型
    text: 名称和描述
    week: 本周
    on: 启用
  row:
    text: '{ref} 描述'
    name: '{ref} 名称'
    delete: 删除 {ref}
    on: '启用 {ref}'
    expand: 展开 {ref}
    collapse: 收起 {ref}
    removedThisWeek: 本周已移除
    keptThisWeek: 本周已保留
    seeAll:
      1: 在活动记录中查看
      n: 在活动记录中查看全部 $1 个
    allTime:
      1: 累计 1 个
      n: 累计 $1 个
    lastHit: 最近命中 {time}
  try:
    label: 试一个标题
    title: 视频标题
    titlePlaceholder: 输入或粘贴视频标题
    channel: 频道
    site: 当作哪个网站的视频
    url: YouTube 视频网址或封面网址（可选）
    urlInvalid: 请使用 YouTube 视频网址或 i.ytimg.com 封面网址。
    needsConsent: 同意发送后才能试标题
    paused: Shoo 已暂停或暂时连不上 OpenRouter。请查看弹窗。
    noCredits: OpenRouter 表示此密钥的额度已用完。
    submit: 试试
    idle: 判定会显示在这里。
    decidedBy: '判定依据：{rule}'
    decidedByNamed: '判定依据：{name}（{rule}）'
    error:
      noKey: 在“连接”中连接 OpenRouter 后才能试标题。
      offline: 你已离线。恢复联网后再试。
      dailyCap: 已达每日上限。午夜后再试。
      model: OpenRouter 没有响应，请重试。
      tooManyRules: 主题规则太多，此决策服务商处理不了。关闭一些，或在“连接”中换一个服务商。
  # A direct Decision provider whose choice question takes fewer options (decision-engine.md Section 12.1).
  tooManyRules: '{provider} 最多支持 {max} 条主题规则，现在开启了 {count} 条。在你关闭一些或在“连接”中换一个决策服务商之前，Shoo 不会按主题检查任何视频。'
  escalation:
    lead: '{channel} 老是出现。'
    detail: '30 天内，{judged} 个已判定的视频中有 {removed} 个被 {rule} 移除。屏蔽这个频道吗？'
    detailNoRule: '30 天内，{judged} 个已判定的视频中有 {removed} 个被主题规则移除。屏蔽这个频道吗？'
    ban: 屏蔽频道
    notNow: 以后再说
  budget:
    label: 阅读预算
    value: '你的规则和保留的视频已占用 {percent}%'
    over: 你的规则和保留的视频超出了模型的阅读预算。请缩短或关闭一条规则。
